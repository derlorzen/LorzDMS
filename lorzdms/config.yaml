# https://contributors.home-assistant.io/apps/reference/configuration/
name: LorzDMS
version: "0.1.6"
slug: lorzdms
description: KI-gestütztes Dokumentenmanagement mit Google Drive als Archiv
url: "https://github.com/derlorzen/LorzDMS/tree/main/lorzdms"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:file-document-multiple-outline
panel_title: LorzDMS
panel_admin: true
hassio_api: false
homeassistant_api: false
map:
  - share:rw
backup: hot
backup_pre: /usr/bin/lorzdms-backup-pre
# Die laufende SQLite-Datei wird nicht gesichert; stattdessen schreibt backup_pre einen
# konsistenten Snapshot (database/snapshot.sqlite3), aus dem beim Start nach einer
# Wiederherstellung automatisch die Datenbank erzeugt wird.
backup_exclude:
  - "cache/*"
  - "database/lorzdms.sqlite3"
  - "database/lorzdms.sqlite3-wal"
  - "database/lorzdms.sqlite3-shm"
options:
  log_level: info
  ocr_languages: deu+eng
  ocr_timeout_seconds: 900
  max_file_size_mb: 50
  min_free_disk_mb: 500
  max_load_per_cpu: 1.5
  processing_window: ""
  local_inbox_enabled: true
  oauth_redirect_uri: "http://127.0.0.1:8765/oauth2callback"
schema:
  log_level: list(debug|info|warning|error)
  ocr_languages: match(^[a-z_]+(\+[a-z_]+)*$)
  ocr_timeout_seconds: int(60,7200)
  max_file_size_mb: int(1,500)
  min_free_disk_mb: int(100,100000)
  max_load_per_cpu: float(0.5,8)
  processing_window: match(^$|^[0-2][0-9]:[0-5][0-9]-[0-2][0-9]:[0-5][0-9]$)
  local_inbox_enabled: bool
  oauth_redirect_uri: url
